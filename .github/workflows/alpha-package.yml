name: alpha-package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-alpha:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify R0 alpha launcher
        run: node --test tests/r0-alpha-config.test.mjs
      - name: Build authoritative release
        run: |
          cargo test --locked --manifest-path server/Cargo.toml --bin myaso-server r0_player_cap_tests
          cargo build --locked --release --manifest-path server/Cargo.toml --bin myaso-server
      - name: Package verified public assets and server binary
        run: |
          set -euo pipefail
          mkdir -p out/bin out/public
          install -m 0755 server/target/release/myaso-server out/bin/myaso-server
          cp -a web out/public/web
          cp -a src out/public/src
          cp -a ops out/ops
          printf '%s\n' "${GITHUB_SHA}" > out/REVISION
          tar -C out -czf "myaso-alpha-${GITHUB_SHA}.tar.gz" .
          sha256sum "myaso-alpha-${GITHUB_SHA}.tar.gz" > "myaso-alpha-${GITHUB_SHA}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: myaso-alpha-linux-amd64
          path: |
            myaso-alpha-*.tar.gz
            myaso-alpha-*.tar.gz.sha256
          retention-days: 14
