name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# P0 (priority zero) queue hygiene: keep the newest branch-owned PR quality
# execution, while NEVER cancelling merged-main release qualification.
# GitHub-hosted runners have no cross-repository numeric priority control.
concurrency:
  group: myaso-quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate coding-agent policy
        run: python scripts/validate_coding_agent_policy.py

      - name: Validate repository governance
        run: python scripts/validate_repository_governance.py

      - name: Compile governance scripts
        run: python -m py_compile scripts/*.py

      - name: Validate combat JavaScript
        run: |
          node --version
          node --check src/combat/model.mjs
          node --check web/game.mjs
          node --test tests/combat-model.test.mjs

      # Independent 4D source/evidence integrity; never substitutes for native World gates.
      - name: Validate Combat 4D independent QA evidence
        run: |
          node --check scripts/combat4d-acceptance.mjs
          node --check scripts/combat4d-m107-proof.mjs
          node --check scripts/combat4d-m155-proof.mjs
          node --check scripts/combat4d-m193-proof.mjs
          node --check scripts/combat4d-m121-proof.mjs
          node --check scripts/combat4d-m172-proof.mjs
          node --test tests/combat4d-acceptance.test.mjs tests/combat4d-m107-proof.test.mjs tests/combat4d-m155-proof.test.mjs tests/combat4d-m193-proof.test.mjs tests/combat4d-m121-proof.test.mjs tests/combat4d-m172-proof.test.mjs
          node scripts/combat4d-m107-proof.mjs qa/evidence/m107-run-39930443888.json
          node scripts/combat4d-m155-proof.mjs qa/evidence/m155-run-39931321731.json
          node scripts/combat4d-m193-proof.mjs qa/evidence/m193-run-39935435948.json
          node scripts/combat4d-m121-proof.mjs qa/evidence/m121-run-39938139017.json
          node scripts/combat4d-m172-proof.mjs qa/evidence/m172-run-39942285919.json

      - name: Validate R3 low-latency combat audio
        run: |
          node --check src/browser/game-audio.mjs
          node --test tests/r3-combat-audio.test.mjs

      # GitHub's headless Linux runner has no hardware speaker. Give Firefox
      # a real PulseAudio output sink rather than bypassing media playback.
      - name: Prepare headless Firefox audio output
        run: |
          if ! command -v pulseaudio >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pulseaudio
          fi
          mkdir -p "$RUNNER_TEMP/myaso-r4-audio"
          chmod 700 "$RUNNER_TEMP/myaso-r4-audio"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/myaso-r4-audio" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/myaso-r4-audio"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=myaso_r4_sound
          pactl set-default-sink myaso_r4_sound
          pactl info

      - name: Validate R4 native recorded audio and ambient music
        run: |
          node --check scripts/r4_audio_browser_acceptance.mjs
          node --test tests/r4-natural-ambient-audio.test.mjs
          node scripts/r4_audio_browser_acceptance.mjs

      - name: Validate R2 responsive controls, server-style dash and combat geometry
        run: |
          node --check src/browser/dash-input.mjs
          node --check src/browser/left-button-charge.mjs
          node --check web/online-game.mjs
          node --check web/game.mjs
          node --test tests/r2-combat-controls.test.mjs tests/r1-lmb-charge-heavy.test.mjs

      - name: Validate realtime networking JavaScript
        run: |
          node --check src/network/constants.mjs
          node --check src/network/sequence.mjs
          node --check src/network/input-codec.mjs
          node --check src/network/input-ack-codec.mjs
          node --check src/network/input-ingress.mjs
          node --check src/network/snapshot-codec.mjs
          node --check src/network/interest-grid.mjs
          node --check src/network/replication-planner.mjs
          node --check web/network-transport.mjs
          node --check scripts/network_capacity_probe.mjs
          node --check tests/m4-snapshot-compat.test.mjs
          node --check tests/m19-compact-record-identity.test.mjs
          node --check tests/m20-compact-facing.test.mjs
          node --check tests/m21-compact-position.test.mjs
          node --test tests/networking.test.mjs tests/m4-snapshot-compat.test.mjs tests/m19-compact-record-identity.test.mjs tests/m20-compact-facing.test.mjs tests/m21-compact-position.test.mjs

      - name: Validate R1 smooth network rendering and jitter guards
        run: |
          node --check src/browser/smooth-motion.mjs
          node --check web/online-game.mjs
          node --test tests/r1-smooth-network.test.mjs tests/browser-runtime.test.mjs

      - name: Validate R1 zoom, offscreen targets and bounded WAN render catch-up
        run: |
          node --check src/browser/arena-viewport.mjs
          node --check src/browser/smooth-motion.mjs
          node --check src/browser/light-attack-movement.mjs
          node --check web/online-game.mjs
          node --test tests/r1-zoom-edge-pointers.test.mjs tests/r1-jitter-smoothing.test.mjs tests/r1-run-replay-movement.test.mjs tests/r1-directional-release-capture.test.mjs tests/r1-smooth-network.test.mjs

      - name: Validate R1 own-snapshot ACK alignment
        run: |
          node --check src/browser/own-snapshot-ack-gate.mjs
          node --check web/authoritative-client.mjs
          node --test tests/r1-own-snapshot-ack-gate.test.mjs tests/m6-browser-authority.test.mjs

      - name: Validate R1 real WebTransport latency telemetry
        run: |
          node --check src/browser/network-diagnostics.mjs
          node --check web/authoritative-client.mjs
          node --check web/online-game.mjs
          node --test tests/r1-network-diagnostics.test.mjs tests/m6-browser-authority.test.mjs

      - name: Validate browser runtime hot path
        run: |
          node --check src/browser/m224-dodge-completion.mjs
          node --check src/browser/frame-budget.mjs
          node --check src/browser/combat-readability.mjs
          node --check src/browser/snapshot-store.mjs
          node --check src/browser/reconciliation.mjs
          node --check src/browser/remote-interpolation.mjs
          node --check src/browser/impairment.mjs
          node --check web/authoritative-client.mjs
          node --check web/bootstrap.mjs
          node --check web/online-game.mjs
          node --check web/flight.mjs
          node --check web/pvp-flight.mjs
          node --check scripts/browser_hotpath_probe.mjs
          node --check scripts/browser_flight_runner.mjs
          node --check scripts/pvp_browser_flight_runner.mjs
          node --check scripts/m225-ffa-threat-distance.mjs
          node --check scripts/m223-server-heavy-windup.mjs
          node --check scripts/m200-feedback-latency.mjs
          node --check scripts/m214-confirmed-feedback-latency.mjs
          node --check scripts/m215-successful-roll-latency.mjs
          node --check scripts/m216-successful-parry-punish-latency.mjs
          node --check scripts/m217-successful-kick-latency.mjs
          node --check scripts/m218-successful-jump-attack-latency.mjs
          node --check scripts/m219-buffered-roll-ingress-evidence.mjs
          node --check scripts/m220-knockdown-focus-timeline.mjs
          node --check scripts/m221-trusted-wheel-attestation.mjs
          node --check scripts/m227-trusted-light-pointer.mjs
          node --check scripts/m202-guardbreak-convergence.mjs
          node --check scripts/m203-w3c-wheel-ack.mjs
          node --check scripts/m208-w3c-wheel-headstart.mjs
          node --check scripts/m207-attack-led-dodge.mjs
          node --check scripts/m209-dual-knockdown-proof.mjs
          node --check scripts/m211-dual-recovery-phase-proof.mjs
          node --check scripts/m201-authoritative-phase-proof.mjs
          node --check scripts/m206-knockdown-punish-proof.mjs
          node --check tests/browser-runtime.test.mjs
          node --check tests/m29-combat-readability.test.mjs
          node --check src/browser/m233-recovery-handoff-trace.mjs
          node --check tests/m233-recovery-handoff-trace.test.mjs
          node --check tests/m234-m145-trusted-light-onset.test.mjs
          node --check tests/r0-alpha-config.test.mjs
          node --check tests/m6-browser-authority.test.mjs
          node --check tests/m7-browser-flight.test.mjs
          node --check tests/m12-reliable-baseline.test.mjs
          node --check tests/m15-reliable-convergence.test.mjs
          node --check tests/m16-browser-512.test.mjs
          node --check tests/m17-reliable-delta.test.mjs
          node --test tests/m250-frame-parry-tell.test.mjs
          node --test tests/m224-dodge-completion.test.mjs tests/m225-ffa-threat-distance.test.mjs tests/m223-server-heavy-windup.test.mjs tests/browser-runtime.test.mjs tests/m6-browser-authority.test.mjs tests/m7-browser-flight.test.mjs tests/m12-reliable-baseline.test.mjs tests/m15-reliable-convergence.test.mjs tests/m16-browser-512.test.mjs tests/m17-reliable-delta.test.mjs tests/m29-combat-readability.test.mjs tests/m200-feedback-latency.test.mjs tests/m214-confirmed-feedback-latency.test.mjs tests/m215-successful-roll-latency.test.mjs tests/m216-successful-parry-punish-latency.test.mjs tests/m217-successful-kick-latency.test.mjs tests/m218-successful-jump-attack-latency.test.mjs tests/m219-buffered-roll-ingress-evidence.test.mjs tests/m220-knockdown-focus-timeline.test.mjs tests/m221-trusted-wheel-attestation.test.mjs tests/m227-trusted-light-pointer.test.mjs tests/m229-heavy-input-loss-evidence.test.mjs tests/m230-heavy-replay-correlation.test.mjs tests/m231-m108-failure-path.test.mjs tests/m232-spatial-handoff-failure.test.mjs tests/m233-recovery-handoff-trace.test.mjs tests/m234-m145-trusted-light-onset.test.mjs tests/m202-guardbreak-convergence.test.mjs tests/m203-w3c-wheel-ack.test.mjs tests/m204-heavy-dodge-input-order.test.mjs tests/m201-authoritative-phase-proof.test.mjs tests/m205-repeat-proof-gate.test.mjs tests/m206-knockdown-punish-proof.test.mjs tests/m208-w3c-wheel-headstart.test.mjs tests/m212-attack-led-short-block.test.mjs tests/m213-suppression-roll-recovery-order.test.mjs tests/m207-attack-led-dodge.test.mjs tests/m209-dual-knockdown-proof.test.mjs tests/m210-early-feint-wheel.test.mjs tests/m211-dual-recovery-phase-proof.test.mjs
          node scripts/browser_hotpath_probe.mjs

      - name: Validate authoritative Rust server
        run: |
          rustc --version
          cargo --version
          cargo fmt --manifest-path server/Cargo.toml -- --check
          cargo check --locked --manifest-path server/Cargo.toml
          cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path server/Cargo.toml

      - name: Validate M188 repeated real heavy counterplay windows
        run: |
          # Three fresh Chrome/Firefox sessions for each real defensive read.
          # Preserve unchanged 100 HP / -64 guard heavy block and parry stun.
          for scenario in uiheavyblock uiheavyparry; do
            for attempt in 1 2 3; do
              echo "M188 $scenario qualification attempt $attempt/3"
              MYASO_PVP_SCENARIO="$scenario" node scripts/pvp_browser_flight_runner.mjs
            done
          done

      - name: Validate M107 real heavy counterplay
        run: |
          node --check scripts/pvp_browser_flight_runner.mjs
          for scenario in uiheavyblock uiheavyparry uiheavydodge; do
            MYASO_PVP_SCENARIO="$scenario" node scripts/pvp_browser_flight_runner.mjs
          done

      - name: Validate R2 middle-mouse held block across three real strikes
        env:
          MYASO_PVP_SCENARIO: "uimiddleblockpressure"
        run: |
          node --check scripts/pvp_browser_flight_runner.mjs
          node --test tests/r2-middle-held-guardbreak.test.mjs
          node scripts/pvp_browser_flight_runner.mjs

      - name: Validate M194 repeated real guard-break block-only pressure
        run: |
          node --check scripts/pvp_browser_flight_runner.mjs
          node --check scripts/r2-release-led-short-block.mjs
          node --test tests/r2-m194-trusted-wheel-release.test.mjs
          # Five fresh Chrome/Firefox W3C sessions, with exact -38 guard-pressure,
          # 100 HP, zero parries, and eventual authoritative guard-break.
          for attempt in 1 2 3 4 5; do
            echo "M194 real guard-break qualification attempt $attempt/5"
            MYASO_PVP_SCENARIO=uiguardbreak node scripts/pvp_browser_flight_runner.mjs
          done

      - name: Validate M175 confirmed kick/attack arbitration
        env:
          MYASO_PVP_SCENARIO: "uistaminaconfirmed"
          MYASO_PVP_FLIGHT_DURATION_MS: "9000"
        run: |
          node --check web/online-game.mjs
          node --check scripts/pvp_browser_flight_runner.mjs
          node --test --test-name-pattern="stamina denial presentation|exhausted roll edge|same-tick roll|exhausted same-tick recovery roll|exhausted later roll|same-tick kick|exhausted same-tick recovery kick|exhausted later kick" tests/m29-combat-readability.test.mjs tests/combat-model.test.mjs
          node scripts/pvp_browser_flight_runner.mjs

      - name: Validate M158 real simultaneous FFA knockdown arbitration
        env:
          MYASO_PVP_SCENARIO: "uimultiknockdownffa"
        run: |
          node --check web/online-game.mjs
          node --check scripts/pvp_browser_flight_runner.mjs
          node --test --test-name-pattern="FFA knockdown arbitration|FFA knockdown punish focus" tests/m29-combat-readability.test.mjs
          node scripts/pvp_browser_flight_runner.mjs

      - name: Validate M64 fixed input ingress batch
        run: cargo test --locked --manifest-path server/Cargo.toml ingress_uses_a_fixed_three_sample_batch

      - name: Validate M65 recovered action context
        run: cargo test --locked --manifest-path server/Cargo.toml coalesc

