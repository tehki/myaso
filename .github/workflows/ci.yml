name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate coding-agent policy
        run: python scripts/validate_coding_agent_policy.py

      - name: Validate repository governance
        run: python scripts/validate_repository_governance.py

      - name: Compile governance scripts
        run: python -m py_compile scripts/*.py

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA" -- . \
            ':(exclude)CODING_AGENT_CONSTITUTION_v1.3.md' \
            ':(exclude)CODING_AGENT_DEVELOPMENT_PRINCIPLES_SYSTEM_PROMPT_v1.6.md'

      - name: Verify main-push provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_main_push_provenance.py
