name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate coding-agent policy
        run: python scripts/validate_coding_agent_policy.py

      - name: Validate repository governance
        run: python scripts/validate_repository_governance.py

      - name: Compile governance scripts
        run: python -m py_compile scripts/*.py

      - name: Validate combat JavaScript
        run: |
          node --version
          node --check src/combat/model.mjs
          node --check web/game.mjs
          node --test tests/combat-model.test.mjs

      - name: Validate realtime networking JavaScript
        run: |
          node --check src/network/constants.mjs
          node --check src/network/sequence.mjs
          node --check src/network/input-codec.mjs
          node --check src/network/input-ingress.mjs
          node --check src/network/snapshot-codec.mjs
          node --check src/network/interest-grid.mjs
          node --check src/network/replication-planner.mjs
          node --check web/network-transport.mjs
          node --check scripts/network_capacity_probe.mjs
          node --test tests/networking.test.mjs

      - name: Validate authoritative Rust server
        run: |
          rustc --version
          cargo --version
          cargo generate-lockfile --manifest-path server/Cargo.toml
          cargo fmt --manifest-path server/Cargo.toml -- --check
          cargo check --manifest-path server/Cargo.toml
          cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path server/Cargo.toml

      - name: Promote exact resolved Rust lock graph
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/authoritative-server-m3'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected = os.environ["EXPECTED_HEAD"]
          branch = os.environ["TARGET_BRANCH"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          ref_url = f"{api}/repos/{repo}/git/ref/heads/{urllib.parse.quote(branch, safe='')}"
          req = urllib.request.Request(ref_url, headers=headers)
          with urllib.request.urlopen(req) as response:
              current = json.load(response)["object"]["sha"]
          if current != expected:
              raise SystemExit(f"branch moved: expected {expected}, found {current}")

          contents_url = f"{api}/repos/{repo}/contents/server/Cargo.lock?ref={urllib.parse.quote(branch, safe='')}"
          try:
              req = urllib.request.Request(contents_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              existing = None
          if existing is not None:
              print("server/Cargo.lock already tracked; no promotion needed")
              raise SystemExit(0)

          lock = Path("server/Cargo.lock").read_bytes()
          payload = json.dumps({
              "message": "Lock M3 Rust dependency graph",
              "content": base64.b64encode(lock).decode("ascii"),
              "branch": branch,
          }).encode("utf-8")
          req = urllib.request.Request(
              f"{api}/repos/{repo}/contents/server/Cargo.lock",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          print("created Cargo.lock commit", result["commit"]["sha"])
          PY

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA" -- . \
            ':(exclude)CODING_AGENT_CONSTITUTION_v1.3.md' \
            ':(exclude)CODING_AGENT_DEVELOPMENT_PRINCIPLES_SYSTEM_PROMPT_v1.6.md'

      - name: Verify main-push provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_main_push_provenance.py
