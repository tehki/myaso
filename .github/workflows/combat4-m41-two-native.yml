name: Combat 4 M41 strict parry World and remote raster (NONRELEASE)

on:
  pull_request:
    paths:
      - "scripts/pvp_browser_flight_runner.mjs"
      - "web/online-game.mjs"
      - "server/src/simulation.rs"
      - "server/src/main.rs"
      - "server/src/lib.rs"
      - ".github/workflows/combat4-m41-two-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-parry-and-remote-tell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYASO_PVP_SCENARIO: uiparrytell
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged native Chrome Firefox parry and visual sources
        run: |
          node --check scripts/pvp_browser_flight_runner.mjs
          node --check web/online-game.mjs
          google-chrome --version
          firefox --version
          chromedriver --version
          geckodriver --version
      - name: Prebuild exact original Rust World outside native parry startup deadline
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: M41 first genuine Firefox wheel real World parry and remote-only pixels
        run: timeout --signal=TERM --kill-after=5s 180s node scripts/pvp_browser_flight_runner.mjs
      - name: M41 second independent genuine Firefox wheel World parry and remote-only pixels
        if: always()
        run: timeout --signal=TERM --kill-after=5s 180s node scripts/pvp_browser_flight_runner.mjs
