name: Combat unified mandatory blocker native qualification (NONRELEASE)

on:
  pull_request:
    paths:
      - "scripts/**"
      - "web/**"
      - "src/**"
      - "server/**"
      - ".github/workflows/combat4-unified-blockers-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-world-native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scenario: [uijumprecoveryffa, uistun, uiparrytell, uiheavyinputloss]
    env:
      MYASO_PVP_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Genuine native prerequisites
        run: |
          node --check scripts/pvp_browser_flight_runner.mjs
          google-chrome --version
          firefox --version
          chromedriver --version
          geckodriver --version
      - name: Build original authoritative World
        run: cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: Strict original native scenario
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 180s node scripts/pvp_browser_flight_runner.mjs 2>&1 | tee native-blocker.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combat-native-${{ matrix.scenario }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: native-blocker.log
          if-no-files-found: warn
