name: Combat 4D M121 native pointerUP before side-keyUP (NONRELEASE)

on:
  pull_request:
    paths:
      - "scripts/pvp_browser_flight_runner.mjs"
      - "tests/combat4-m121-native-directional-terminal-order.test.mjs"
      - "web/online-game.mjs"
      - "server/src/simulation.rs"
      - ".github/workflows/combat4d-m121-terminal-order-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-m121-directional-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    env:
      MYASO_PVP_SCENARIO: uidirectionallight
    steps:
      - uses: actions/checkout@v4
      - name: Verify physical cross-source W3C order and original helpers
        run: |
          node --test tests/combat4-m121-native-directional-terminal-order.test.mjs
          node --check scripts/pvp_browser_flight_runner.mjs
          google-chrome --version
          firefox --version
          chromedriver --version
          geckodriver --version
      - name: Compile unchanged original Rust authoritative World
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: Strict two original Chrome Firefox directional sweeps with 34HP World
        run: timeout --signal=TERM --kill-after=5s 180s node scripts/pvp_browser_flight_runner.mjs
