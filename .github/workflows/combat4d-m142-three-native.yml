name: Combat 4D M142 secondary FFA real W3C distance ordering (NONRELEASE)

on:
  pull_request:
    paths:
      - "scripts/pvp_browser_flight_runner.mjs"
      - "scripts/m225-ffa-threat-distance.mjs"
      - "tests/m225-ffa-threat-distance.test.mjs"
      - "server/src/simulation.rs"
      - ".github/workflows/combat4d-m142-three-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-three-browser-secondary-threat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    env:
      MYASO_PVP_SCENARIO: uijumpffasecondary
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Original deterministic distance planner and genuine native prerequisites
        run: |
          node --test tests/m225-ffa-threat-distance.test.mjs
          node --check scripts/pvp_browser_flight_runner.mjs
          google-chrome --version
          firefox --version
          chromedriver --version
          geckodriver --version
      - name: Compile original authoritative Rust World
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: Strict original M142 secondary three-browser W3C and World acceptance
        run: timeout --signal=TERM --kill-after=5s 180s node scripts/pvp_browser_flight_runner.mjs
