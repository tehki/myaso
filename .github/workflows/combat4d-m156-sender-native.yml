name: Combat 4D M156 genuine short LMB 30Hz sender trace (NONRELEASE)

on:
  pull_request:
    paths:
      - "web/online-game.mjs"
      - "scripts/pvp_browser_flight_runner.mjs"
      - "server/src/simulation.rs"
      - "tests/combat4-m156-native-sender-proof.test.mjs"
      - ".github/workflows/combat4d-m156-sender-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-three-browser-short-click:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    env:
      MYASO_PVP_SCENARIO: uirollknockdownffahit
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged native scenario, sender and Chrome Firefox drivers
        run: |
          node --test tests/combat4-m156-native-sender-proof.test.mjs
          node --check web/online-game.mjs
          node --check scripts/pvp_browser_flight_runner.mjs
          google-chrome --version
          firefox --version
          chromedriver --version
          geckodriver --version
      - name: Compile original Rust World for real native W3C clients
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: Strict original M156 third-party punish, original World, original assertions
        run: timeout --signal=TERM --kill-after=5s 180s node scripts/pvp_browser_flight_runner.mjs
