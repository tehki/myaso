name: Core C3i atomic equipment swap PostgreSQL acceptance

on:
  pull_request:
    paths:
      - "server/sql/004_atomic_equipment_swaps.sql"
      - "scripts/verify_atomic_equipment_swaps_pg.py"
      - ".github/workflows/core-c3i-equipment-swap.yml"
  push:
    branches: [main]
    paths:
      - "server/sql/004_atomic_equipment_swaps.sql"
      - "scripts/verify_atomic_equipment_swaps_pg.py"
      - ".github/workflows/core-c3i-equipment-swap.yml"

permissions:
  contents: read

jobs:
  swap-two-items:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myaso_c3i_test
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: myaso_c3i_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myaso_c3i_test -d myaso_c3i_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: myaso_c3i_test
      PGPASSWORD: ephemeral-test-only
      PGDATABASE: myaso_c3i_test
      MYASO_C3I_TEST_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Validate isolated test harness
        run: |
          python -m py_compile scripts/verify_atomic_item_world_pg.py
          python -m py_compile scripts/verify_atomic_equipment_swaps_pg.py
      - name: Install C4c + C4d + C3g/C3h + C3i migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f server/sql/001_zone_authority_postgres.sql
          psql -X -v ON_ERROR_STOP=1 -f server/sql/002_fenced_world_mutations.sql
          psql -X -v ON_ERROR_STOP=1 -f server/sql/003_atomic_item_world_mutations.sql
          psql -X -v ON_ERROR_STOP=1 -f server/sql/004_atomic_equipment_swaps.sql
      - name: Prove fenced two-item atomic swap and crash recovery
        run: python scripts/verify_atomic_equipment_swaps_pg.py
