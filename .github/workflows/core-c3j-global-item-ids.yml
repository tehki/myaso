name: Core C3j global item operation ID PostgreSQL acceptance

on:
  pull_request:
    paths:
      - "server/sql/005_global_item_operation_ids.sql"
      - "scripts/verify_global_item_operation_ids_pg.py"
      - ".github/workflows/core-c3j-global-item-ids.yml"
  push:
    branches: [main]
    paths:
      - "server/sql/005_global_item_operation_ids.sql"
      - "scripts/verify_global_item_operation_ids_pg.py"
      - ".github/workflows/core-c3j-global-item-ids.yml"

permissions:
  contents: read

jobs:
  global-item-operation-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myaso_c3j_test
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: myaso_c3j_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myaso_c3j_test -d myaso_c3j_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: myaso_c3j_test
      PGPASSWORD: ephemeral-test-only
      PGDATABASE: myaso_c3j_test
      MYASO_C3J_TEST_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Compile all accepted Python transaction harnesses
        run: |
          python -m py_compile scripts/verify_atomic_item_world_pg.py
          python -m py_compile scripts/verify_atomic_equipment_swaps_pg.py
          python -m py_compile scripts/verify_global_item_operation_ids_pg.py
      - name: Install Core C4c, C4d, C3g/C3h and C3i schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f server/sql/001_zone_authority_postgres.sql
          psql -X -v ON_ERROR_STOP=1 -f server/sql/002_fenced_world_mutations.sql
          psql -X -v ON_ERROR_STOP=1 -f server/sql/003_atomic_item_world_mutations.sql
          psql -X -v ON_ERROR_STOP=1 -f server/sql/004_atomic_equipment_swaps.sql
      - name: Seed real historical C3g and C3i receipts before upgrading
        run: python scripts/verify_global_item_operation_ids_pg.py --seed
      - name: Atomically backfill and install shared item operation reservation
        run: psql -X -v ON_ERROR_STOP=1 -f server/sql/005_global_item_operation_ids.sql
      - name: Prove cross-protocol replay, contention and rollback
        run: python scripts/verify_global_item_operation_ids_pg.py
