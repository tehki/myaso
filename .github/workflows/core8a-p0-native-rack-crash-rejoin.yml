name: Core 8A P0 four native rack crash and replacement recovery

on:
  pull_request:
    paths:
      - "scripts/alpha_m1_four_real_browser_flight.mjs"
      - "scripts/alpha_p0_rack_walk_math.mjs"
      - "tests/alpha_p0_rack_walk_math.test.mjs"
      - ".github/workflows/core8a-p0-native-rack-crash-rejoin.yml"
      - "server/src/**"
      - "src/world/alpha-armory.mjs"

permissions:
  contents: read

jobs:
  four-native-crash-rejoin-rack:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on original World and recovery roster contract
        run: |
          node --check scripts/alpha_m1_four_real_browser_flight.mjs
          node --check scripts/alpha_p0_rack_walk_math.mjs
          node --test tests/alpha_p0_rack_walk_math.test.mjs
          node scripts/verify-core8c-greyhaven-geometry.mjs
          node scripts/verify-world-alpha-solid-artifact.mjs
      - name: Verify actual Chrome Firefox and W3C WebDrivers
        run: |
          google-chrome --version
          chromedriver --version
          firefox --version
          geckodriver --version
      - name: Build pinned original Rust QUIC authority
        run: cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: Original four physical W3C walks then real Firefox SIGKILL and new player5 rack recovery
        env:
          MYASO_ALPHA_NATIVE_GREYHAVEN: "1"
          MYASO_ALPHA_NATIVE_RACK_WALK: "1"
          MYASO_ALPHA_NATIVE_RACK_REACH: "1"
          MYASO_ALPHA_NATIVE_RACK_CRASH_REJOIN: "1"
        run: timeout --signal=TERM --kill-after=5s 180s node scripts/alpha_m1_four_real_browser_flight.mjs
      - name: Preserve genuine native W3C screenshot evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: core8a-p0-real-four-rack-abrupt-rejoin
          path: alpha-m1-four-browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
