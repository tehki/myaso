name: Core 8A P0 real four player same-tick body clearance at Blacksmith

on:
  pull_request:
    paths:
      - "scripts/alpha_m1_four_real_browser_flight.mjs"
      - "scripts/alpha_p0_native_same_tick_clearance.mjs"
      - "tests/alpha_p0_native_same_tick_clearance.test.mjs"
      - ".github/workflows/core8a-p0-native-rack-same-tick-clearance.yml"
      - "src/world/alpha-armory.mjs"
      - "server/src/**"

permissions:
  contents: read

jobs:
  genuine-native-four-player-clearance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Pure fail-closed positive and overlapping four-player snapshots
        run: |
          node --check scripts/alpha_m1_four_real_browser_flight.mjs
          node --check scripts/alpha_p0_native_same_tick_clearance.mjs
          node --test tests/alpha_p0_native_same_tick_clearance.test.mjs
          node scripts/verify-core8c-greyhaven-geometry.mjs
          node scripts/verify-world-alpha-solid-artifact.mjs
      - name: Genuine native Chrome Firefox WebDriver environment
        run: |
          google-chrome --version
          chromedriver --version
          firefox --version
          geckodriver --version
      - name: Compile actual original Rust WebTransport server and collision
        run: cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: Four real W3C players approach four swords then SIGKILL Firefox and verify SAME-TICK clearance before and after
        env:
          MYASO_ALPHA_NATIVE_GREYHAVEN: "1"
          MYASO_ALPHA_NATIVE_RACK_WALK: "1"
          MYASO_ALPHA_NATIVE_RACK_REACH: "1"
          MYASO_ALPHA_NATIVE_RACK_CRASH_REJOIN: "1"
          MYASO_ALPHA_NATIVE_RACK_SAME_TICK_CLEARANCE: "1"
        run: timeout --signal=TERM --kill-after=5s 180s node scripts/alpha_m1_four_real_browser_flight.mjs
      - name: Preserve actual browser evidence even on a correctly detected dynamic collision
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: core8a-p0-real-native-same-tick-clearance
          path: alpha-m1-four-browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 3
