name: Core 8A Pre-Alpha Chat C1 default OFF real QUIC acceptance

on:
  pull_request:
    paths:
      - "server/tests/local_chat_multiplayer.rs"
      - "server/src/chat.rs"
      - "server/src/main.rs"
      - ".github/workflows/core8a-prealpha-chat-default-off.yml"

permissions:
  contents: read

jobs:
  prealpha-no-chat-without-operator-flag:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Original strict Rust formatting
        run: cargo fmt --all --check --manifest-path server/Cargo.toml
      - name: Genuine certificate-pinned two-peer QUIC default-off security regression
        run: |
          cargo test --locked --manifest-path server/Cargo.toml --test local_chat_multiplayer \
            prealpha_default_off_chat_stream_cannot_open_but_two_real_quic_fighters_keep_input_ack -- --exact --nocapture
      - name: Original strict Rust all-target Clippy
        run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
