name: Core 8C pinned Greyhaven static geometry

on:
  pull_request:
    paths:
      - "assets/world/greyhaven-alpha-solids-v1.json"
      - "server/src/alpha_greyhaven_geometry.rs"
      - "server/src/alpha_greyhaven_solids_generated.rs"
      - "server/src/lib.rs"
      - "scripts/verify-core8c-greyhaven-geometry.mjs"
      - ".github/workflows/core8c-p0-static-geometry.yml"
  push:
    branches: [main]
    paths:
      - "assets/world/greyhaven-alpha-solids-v1.json"
      - "server/src/alpha_greyhaven_geometry.rs"
      - "server/src/alpha_greyhaven_solids_generated.rs"
      - "server/src/lib.rs"
      - "scripts/verify-core8c-greyhaven-geometry.mjs"
      - ".github/workflows/core8c-p0-static-geometry.yml"

permissions:
  contents: read

jobs:
  static-authoring-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned World JSON matches compiled Rust shapes
        run: node scripts/verify-core8c-greyhaven-geometry.mjs
      - name: Strict Rust formatting and lint
        run: |
          cargo fmt --manifest-path server/Cargo.toml -- --check
          cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: Core owned static geometry Rust acceptance
        run: cargo test --locked --manifest-path server/Cargo.toml --lib alpha_greyhaven_geometry -- --nocapture
