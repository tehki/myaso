name: graphics-adult-character-contract

on:
  pull_request:
    paths:
      - "src/browser/character-appearance.mjs"
      - "tests/character-appearance.test.mjs"
      - "docs/art/ADULT_CHARACTER_PRESENTATION_V1.md"
      - ".github/workflows/graphics-adult-character-contract.yml"

permissions:
  contents: read

jobs:
  presentation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check graphics presentation syntax
        run: |
          node --check src/browser/character-appearance.mjs
          node --check tests/character-appearance.test.mjs
      - name: Verify bare-body defaults and full-loot art-layer safety
        run: node --test tests/character-appearance.test.mjs
