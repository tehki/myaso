name: Graphics3B P1 Quaternius CC0 Greyhaven source and Blender preview

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "third_party/quaternius/medieval-village-megakit-standard"
      - "assets/environment/greyhaven/quaternius-standard-preview/**"
      - "tools/art/verify_quaternius_standard_source.mjs"
      - "tools/art/render_quaternius_greyhaven_preview.py"
      - "tools/art/bake_quaternius_greyhaven_review_sprites.py"
      - "tools/art/verify_quaternius_original_world_native_2d5.mjs"
      - "web/graphics3b-quaternius-2d5-local-review.*"
      - ".github/workflows/graphics3b-p1-quaternius-standard-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-standard-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify original pinned 176 Standard-model glTF and real texture dependencies
        run: |
          node --check tools/art/verify_quaternius_standard_source.mjs
          node tools/art/verify_quaternius_standard_source.mjs
          python3 -m py_compile tools/art/render_quaternius_greyhaven_preview.py
      - name: Install Blender for offscreen isolated art trial
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy python3-pil
          blender --version
      - name: Assemble original glTF cottage and render genuine day/dusk Blood and Iron candidates
        run: |
          mkdir -p .artifacts/quaternius-greyhaven
          blender --background --threads 2 --python tools/art/render_quaternius_greyhaven_preview.py -- \
            --manifest assets/environment/greyhaven/quaternius-standard-preview/manifest.json \
            --source third_party/quaternius/medieval-village-megakit-standard/glTF \
            --output .artifacts/quaternius-greyhaven
          test -s .artifacts/quaternius-greyhaven/greyhaven-quaternius-cottage-day.png
          test -s .artifacts/quaternius-greyhaven/greyhaven-quaternius-cottage-dusk.png
          test -s .artifacts/quaternius-greyhaven/greyhaven-quaternius-cottage-source.blend
          test -s .artifacts/quaternius-greyhaven/quaternius-greyhaven-review-report.json
      - name: Bake only the genuine V2 rendered original Blender frames as transparent review WebPs
        run: |
          node --check web/graphics3b-quaternius-2d5-local-review.mjs
          python3 -m py_compile tools/art/bake_quaternius_greyhaven_review_sprites.py
          python3 tools/art/bake_quaternius_greyhaven_review_sprites.py \
            --source .artifacts/quaternius-greyhaven \
            --dest .artifacts/quaternius-greyhaven-sprite-review
          test -s .artifacts/quaternius-greyhaven-sprite-review/greyhaven-quaternius-2d5-review-manifest.json
          test -s .artifacts/quaternius-greyhaven-sprite-review/greyhaven-quaternius-cottage-day-2d5-review.webp
          test -s .artifacts/quaternius-greyhaven-sprite-review/greyhaven-quaternius-cottage-dusk-2d5-review.webp
      - name: Retain optimized review sprites and hash/authority manifest separately from game assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics3b-p1-quaternius-blood-iron-2d5-visual-only-sprite-review
          path: .artifacts/quaternius-greyhaven-sprite-review/*
          retention-days: 7
          if-no-files-found: ignore
      - name: Actual Chrome and Firefox source World9 Red Lion vs native Quaternius sprites
        run: |
          node --check tools/art/verify_quaternius_original_world_native_2d5.mjs
          google-chrome --version
          firefox --version
          chromedriver --version
          geckodriver --version
          timeout --signal=TERM --kill-after=5s 180s node tools/art/verify_quaternius_original_world_native_2d5.mjs
      - name: Retain genuine Chrome Firefox original World9 source Canvas screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics3b-quaternius-2d5-original-world9-native-chrome-firefox
          path: .artifacts/quaternius-greyhaven-browser-2d5-review/*
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve original CC0 modular building Blender source and genuine rendered previews
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: graphics3b-p1-quaternius-cc0-original-modular-house-review
          path: .artifacts/quaternius-greyhaven/*
          retention-days: 7
          if-no-files-found: ignore
