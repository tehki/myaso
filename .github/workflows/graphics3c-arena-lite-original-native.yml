name: Graphics3C Arena Lite real original Rust and Chrome Firefox four-browser QA

on:
  pull_request:
    paths:
      - ".github/workflows/graphics3c-arena-lite-original-native.yml"
      - "web/online-game.mjs"
      - "src/browser/prealpha-arena-lite-floor.mjs"
      - "src/browser/prealpha-arena-lite-selection.mjs"
      - "tools/art/verify_pre_alpha_arena_lite_real_game.mjs"
      - "tools/art/check_pre_alpha_arena_lite_native_matrix.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arena-lite-real-game-native:
    name: original Rust QUIC plus four genuine Chrome Firefox W3C sessions
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact original PR head (never temporary merge SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify test source is exactly the requested branch head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check
      - name: Original source and bounded test-only native QA contract
        run: |
          node --version
          node --check tools/art/verify_pre_alpha_arena_lite_real_game.mjs
          node --check tools/art/check_pre_alpha_arena_lite_native_matrix.mjs
          node --check web/online-game.mjs
          node --test tests/prealpha-arena-lite-floor.test.mjs tests/prealpha-arena-lite-optin.test.mjs
      - name: Verify native engines and original Rust availability
        run: |
          google-chrome --version
          firefox --version
          chromedriver --version
          geckodriver --version
          cargo --version
      - name: Four real local Rust WebTransport seats, original vs opt-in floor in Chrome Firefox
        env:
          MYASO_ARENA_LITE_CARGO_OFFLINE: "0"
          MYASO_ARENA_LITE_NATIVE_BROWSERS: "chrome,firefox,chrome,firefox"
          MYASO_ARENA_LITE_NATIVE_OUT: "alpha-p0-arena-lite-original-game-native/normal"
          MYASO_ARENA_LITE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p alpha-p0-arena-lite-original-game-native
          timeout --signal=TERM --kill-after=5s 720s node tools/art/verify_pre_alpha_arena_lite_real_game.mjs
          MYASO_ARENA_LITE_INVERT_MODE=1 MYASO_ARENA_LITE_NATIVE_OUT=alpha-p0-arena-lite-original-game-native/inverted timeout --signal=TERM --kill-after=5s 720s node tools/art/verify_pre_alpha_arena_lite_real_game.mjs
          node tools/art/check_pre_alpha_arena_lite_native_matrix.mjs alpha-p0-arena-lite-original-game-native/normal alpha-p0-arena-lite-original-game-native/inverted
      - name: Upload authentic in-game Canvas/page PNGs and SHA report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: graphics3c-arena-lite-original-four-player-chrome-firefox
          path: alpha-p0-arena-lite-original-game-native/**
          if-no-files-found: ignore
          retention-days: 7
