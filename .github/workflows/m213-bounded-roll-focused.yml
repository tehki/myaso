# Branch-local acceptance qualifier; remove before release merge.
name: M213 focused M162
on:
  push:
    branches:
      - "feature/m213-*"
permissions:
  contents: read
jobs:
  real-m162:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate strict suppression-roll regression unit
        run: node --test tests/m213-suppression-roll-recovery-order.test.mjs
      - name: Compile unchanged authoritative Rust game
        run: cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: Prove three real-browser M162 recoveries
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "M213 genuine bounded suppression roll attempt $attempt/3"
            MYASO_PVP_SCENARIO=uirollknockdownbounded node scripts/pvp_browser_flight_runner.mjs
          done
