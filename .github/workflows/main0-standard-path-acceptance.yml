name: Main 0 standard-path parry and M156 acceptance (NONRELEASE)

on:
  pull_request:
    paths:
      - "server/**"
      - "src/**"
      - "web/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/main0-standard-path-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standard-input-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Original World stale-block regression
        run: |
          set -o pipefail
          cargo test --locked --manifest-path server/Cargo.toml --bin myaso-server delayed_unseen_old_block_cannot_restart_parry_after_newer_neutral -- --nocapture 2>&1 | tee standard-ordering.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-ordering-${{ github.event.pull_request.head.sha || github.sha }}
          path: standard-ordering.log
          if-no-files-found: error
  standard-original-world:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scenario: [uistun, uiparrytell, uirollknockdownffahit]
        trial: [1, 2]
    env:
      MYASO_PVP_SCENARIO: ${{ matrix.scenario }}
      CANDIDATE_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SOURCE }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin source and verify standard native prerequisites
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          git rev-parse HEAD > candidate-source.txt
          node --check scripts/pvp_browser_flight_runner.mjs
          node --test tests/*parry*.test.mjs tests/r1-m156-knockdown-light-latency.test.mjs tests/r1-m237-m156-short-click-early-commit.test.mjs tests/m156-original-world-trace.test.mjs
          node --test tests/standard-wheel-controls.test.mjs
          google-chrome --version
          firefox --version
          chromedriver --version
          geckodriver --version
      - name: Build original standard-protocol World without experimental features
        run: cargo build --locked --manifest-path server/Cargo.toml --bin myaso-server
      - name: Genuine standard-path gameplay and original World trace
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 180s node scripts/pvp_browser_flight_runner.mjs 2>&1 | tee standard-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-${{ matrix.scenario }}-${{ matrix.trial }}-${{ env.CANDIDATE_SOURCE }}
          path: |
            candidate-source.txt
            standard-native.log
          if-no-files-found: error
