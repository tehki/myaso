name: UI10 Chat C1 authenticated UI review
on:
  pull_request:
    paths:
      - "src/browser/chat-c1-activation.mjs"
      - "src/browser/local-chat.mjs"
      - "src/network/chat-codec.mjs"
      - "src/network/local-chat-ui-bridge.mjs"
      - "web/local-chat.css"
      - "tests/chat-*.test.mjs"
      - "tests/local-chat-ui-bridge.test.mjs"
      - ".github/workflows/ui10-chat-c1-review.yml"
  workflow_dispatch:
jobs:
  chat-c1-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Chat C1 client, composer isolation, and ACK/UTF-8
        run: |
          node --check src/browser/local-chat.mjs
          node --check src/browser/chat-c1-activation.mjs
          node --test tests/chat-c1-combat-input-isolation.test.mjs tests/chat-c1-adapter-lifecycle.test.mjs tests/chat-c1-core-preview.test.mjs tests/chat-c1-foundation.test.mjs tests/local-chat-ui-bridge.test.mjs tests/chat-codec.test.mjs
